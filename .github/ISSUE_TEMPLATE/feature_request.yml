name: Feature request
description: Suggest a capability kn does not have yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `kn` is a personal framework the maintainer uses for their own projects, so the roadmap is opinionated and the catalog is deliberately curated rather than exhaustive.

        That does not mean suggestions are unwelcome — it means it is worth opening this issue **before** writing code, so nobody spends an afternoon on something that will not be merged.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you are in, not the solution you have in mind. This is the part that determines whether the feature is worth building.
      placeholder: "When I start a new project with X, I have to manually … every time."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like kn to do?
      description: If it is a new command or flag, show what invoking it would look like.
      render: shell
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Existing commands, external tools, or manual steps you use today.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of kn does this touch?
      options:
        - CLI command or flag
        - Skill catalog
        - Stack preset
        - Agent definition
        - MCP integration
        - Installation or packaging
        - Documentation
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you be willing to implement it?
      options:
        - label: I would be willing to open a pull request for this
          required: false
