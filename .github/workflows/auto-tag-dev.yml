# ============================================
# Auto-Tag Dev - Release Candidates
# Description: Analyze conventional commits since last tag,
#              determine SemVer bump, and create RC tag on dev branch
# ============================================
name: Auto-Tag Dev (RC)

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.beads/**'

permissions:
  contents: write

jobs:
  auto-tag-rc:
    name: Create RC Tag
    runs-on: ubuntu-latest
    # Prevent infinite loop: skip if pushed by github-actions bot
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for tag analysis

      - name: Determine version bump and create RC tag
        id: tag
        run: |
          set -euo pipefail

          echo "🔍 Analyzing commits for version bump..."

          # Get the latest stable tag (vX.Y.Z without -rc suffix)
          LATEST_STABLE=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "")

          if [ -z "$LATEST_STABLE" ]; then
            echo "No stable tags found, using v0.0.0 as base"
            LATEST_STABLE="v0.0.0"
            # Get all commits
            COMMITS=$(git log --oneline --format='%s' 2>/dev/null || echo "")
          else
            echo "Latest stable tag: $LATEST_STABLE"
            # Get commits since last stable tag
            COMMITS=$(git log "${LATEST_STABLE}..HEAD" --oneline --format='%s' 2>/dev/null || echo "")
          fi

          if [ -z "$COMMITS" ]; then
            echo "No new commits since $LATEST_STABLE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "📝 Commits since $LATEST_STABLE:"
          echo "$COMMITS"
          echo ""

          # Parse current version
          VERSION="${LATEST_STABLE#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Determine bump type
          HAS_BREAKING=false
          HAS_FEAT=false
          HAS_PATCH=false

          while IFS= read -r commit; do
            # Check for breaking change (! before colon)
            if echo "$commit" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
              HAS_BREAKING=true
            fi
            # Check for feat
            if echo "$commit" | grep -qE '^feat(\([^)]*\))?[!]?:'; then
              HAS_FEAT=true
            fi
            # Check for patch-level types
            if echo "$commit" | grep -qE '^(fix|hotfix|refactor|chore|docs|style|test)(\([^)]*\))?[!]?:'; then
              HAS_PATCH=true
            fi
          done <<< "$COMMITS"

          # Calculate new version
          if [ "$HAS_BREAKING" = true ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP="MAJOR (breaking change)"
          elif [ "$HAS_FEAT" = true ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP="MINOR (new feature)"
          elif [ "$HAS_PATCH" = true ]; then
            PATCH=$((PATCH + 1))
            BUMP="PATCH (fix/chore/etc)"
          else
            echo "⚠️ No conventional commits found, skipping tag"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "📊 Bump type: $BUMP"
          echo "📦 New version: $NEW_VERSION"

          # Find the latest RC for this version
          LATEST_RC=$(git tag --list "${NEW_VERSION}-rc.*" --sort=-version:refname | head -1 || echo "")

          if [ -z "$LATEST_RC" ]; then
            RC_NUM=1
          else
            # Extract RC number and increment
            RC_NUM=$(echo "$LATEST_RC" | sed "s/${NEW_VERSION}-rc\.\(.*\)/\1/")
            RC_NUM=$((RC_NUM + 1))
          fi

          NEW_TAG="${NEW_VERSION}-rc.${RC_NUM}"
          echo "🏷️ New RC tag: $NEW_TAG"

          # Create and push tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release candidate: $NEW_TAG

          Bump: $BUMP
          Base: $LATEST_STABLE
          Commits: $(echo "$COMMITS" | wc -l | tr -d ' ')"

          git push origin "$NEW_TAG"

          echo "✅ Tag $NEW_TAG created and pushed"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: steps.tag.outputs.skip != 'true'
        run: |
          echo "### 🏷️ Release Candidate Created" >> "$GITHUB_SUMMARY"
          echo "" >> "$GITHUB_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_SUMMARY"
          echo "| **Tag** | \`${{ steps.tag.outputs.tag }}\` |" >> "$GITHUB_SUMMARY"
          echo "| **Version** | \`${{ steps.tag.outputs.version }}\` |" >> "$GITHUB_SUMMARY"
          echo "| **Bump** | ${{ steps.tag.outputs.bump }} |" >> "$GITHUB_SUMMARY"
          echo "| **Branch** | \`dev\` |" >> "$GITHUB_SUMMARY"
