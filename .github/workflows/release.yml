name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true

permissions:
  contents: write
  discussions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build binaries for main platforms
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: kn
            asset_name: kn-linux-x86_64
          
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: kn
            asset_name: kn-macos-x86_64
          
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: kn
            asset_name: kn-macos-arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked
        working-directory: ./cli
      
      - name: Strip binary
        run: strip cli/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
      
      - name: Create tarball
        run: |
          cd cli/target/${{ matrix.target }}/release
          tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          mv ${{ matrix.asset_name }}.tar.gz ../../../../
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz
          retention-days: 1

  # Create GitHub release
  create-release:
    name: Create GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure
        run: ls -R artifacts
      
      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" \) -exec sha256sum {} \; > ../checksums.txt
          cd ..
      
      - name: Create Release Notes
        run: |
          cat > release-notes.md << 'EOF'
          ## Installation
          
          ### Binary Downloads
          
          Download the appropriate binary for your platform:
          
          - **Linux x86_64**: `kn-linux-x86_64.tar.gz`
          - **macOS x86_64**: `kn-macos-x86_64.tar.gz`
          - **macOS ARM64** (Apple Silicon): `kn-macos-arm64.tar.gz`
          
          Extract and move to your PATH:
          
          ```bash
          tar xzf kn-*.tar.gz
          sudo mv kn /usr/local/bin/
          
          # Or user directory
          mv kn ~/.local/bin/
          ```
          
          ### Automated Installer
          
          ```bash
          curl -fsSL https://raw.githubusercontent.com/kobogithub/knowledge/prod/install.sh | bash
          ```
          
          ### Verify Installation
          
          ```bash
          kn --version
          kn doctor
          ```
          
          ## What's Changed
          
          See [CHANGELOG.md](https://github.com/kobogithub/knowledge/blob/prod/CHANGELOG.md) for full details.
          
          ## Checksums
          
          ```
          $(cat checksums.txt)
          ```
          EOF
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
            checksums.txt
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
