[package]
name = "kn"
version = "0.1.0"
edition = "2021"
authors = ["Knowledge Framework Contributors"]
description = "CLI tool for AI-assisted development workflows"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1.0"
colored = "2.1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2.5"
